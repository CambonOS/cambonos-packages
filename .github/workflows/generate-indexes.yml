name: Generate CambonOS Indexes

on:
  workflow_dispatch:

permissions:
  contents: write   # necesario para hacer push a gh-pages

concurrency:
  group: cambonos-gh-pages-write
  cancel-in-progress: false

jobs:
  generate-indexes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Generate directory indexes
        env:
          REPO_TITLE: CambonOS Package Repository
        run: |
          python3 - <<'PY'
          import os
          from html import escape
          from pathlib import Path
          from urllib.parse import quote

          ROOT = Path("site")
          TITLE = os.environ["REPO_TITLE"]
          MARKER = "<!-- generated-by: cambonos-index -->"

          def human(n):
              if n < 1024:
                  return f"{n} B"
              for unit in ("KiB", "MiB", "GiB"):
                  n /= 1024
                  if n < 1024 or unit == "GiB":
                      return f"{n:.1f} {unit}"

          PAGE = """<!DOCTYPE html>
          {marker}
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Index of {path}</title>
          <style>
            :root {{ color-scheme: light dark; }}
            body {{ font: 15px/1.5 ui-monospace, monospace; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }}
            table {{ width: 100%; border-collapse: collapse; }}
            td, th {{ padding: .2rem .6rem; text-align: left; }}
            td:last-child, th:last-child {{ text-align: right; }}
            tr:hover td {{ background: rgba(128,128,128,.15); }}
            a {{ text-decoration: none; }}
            a:hover {{ text-decoration: underline; }}
            small {{ opacity: .6; }}
          </style></head><body>
          <h1>{title}</h1>
          <h2>Index of {path}</h2>
          <table>
          <tr><th>Name</th><th>Size</th></tr>
          {rows}
          </table>
          <hr><small>Generated by GitHub Actions</small>
          </body></html>
          """

          generated = skipped = 0

          for d, dirs, files in os.walk(ROOT):
              dirs[:] = sorted(x for x in dirs if not x.startswith("."))
              files = sorted(f for f in files if not f.startswith(".") and f != "index.html")
              out = Path(d) / "index.html"

              # Respeta los index.html manuales (los autogenerados llevan marcador)
              if out.exists() and MARKER not in out.read_text(errors="ignore"):
                  skipped += 1
                  continue

              rel = Path(d).relative_to(ROOT)
              path = "/" if rel == Path(".") else "/" + rel.as_posix() + "/"

              rows = []
              if rel != Path("."):
                  rows.append('<tr><td><a href="../">../</a></td><td></td></tr>')
              for name in dirs:
                  rows.append(f'<tr><td><a href="{quote(name)}/">{escape(name)}/</a></td><td>-</td></tr>')
              for name in files:
                  size = human((Path(d) / name).stat().st_size)
                  rows.append(f'<tr><td><a href="{quote(name)}">{escape(name)}</a></td><td>{size}</td></tr>')

              out.write_text(PAGE.format(marker=MARKER, path=escape(path),
                                         title=escape(TITLE), rows="\n".join(rows)))
              generated += 1

          print(f"Indexes generated: {generated}, manual ones kept: {skipped}")
          PY

      - name: Commit and push changes
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes in indexes, nothing to commit."
          else
            git commit -m "chore: regenerate directory indexes"
            git push origin gh-pages
          fi
