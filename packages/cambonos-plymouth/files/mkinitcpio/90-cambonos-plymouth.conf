if [[ ! " ${HOOKS[*]} " =~ [[:space:]]plymouth[[:space:]] ]]; then
  _cambonos_plymouth_hooks=()
  _cambonos_plymouth_has_encrypt=0
  _cambonos_plymouth_added=0

  for _cambonos_plymouth_hook in "${HOOKS[@]}"; do
    if [[ "$_cambonos_plymouth_hook" == encrypt || "$_cambonos_plymouth_hook" == sd-encrypt ]]; then
      _cambonos_plymouth_has_encrypt=1
      break
    fi
  done

  for _cambonos_plymouth_hook in "${HOOKS[@]}"; do
    _cambonos_plymouth_hooks+=("$_cambonos_plymouth_hook")

    if (( ! _cambonos_plymouth_added )) && {
      { (( _cambonos_plymouth_has_encrypt )) && [[ "$_cambonos_plymouth_hook" == encrypt || "$_cambonos_plymouth_hook" == sd-encrypt ]]; } ||
      { (( ! _cambonos_plymouth_has_encrypt )) && [[ "$_cambonos_plymouth_hook" == systemd || "$_cambonos_plymouth_hook" == udev ]]; }
    }; then
      _cambonos_plymouth_hooks+=(plymouth)
      _cambonos_plymouth_added=1
    fi
  done

  if (( ! _cambonos_plymouth_added )); then
    _cambonos_plymouth_hooks+=(plymouth)
  fi

  HOOKS=("${_cambonos_plymouth_hooks[@]}")
  unset _cambonos_plymouth_hooks _cambonos_plymouth_has_encrypt _cambonos_plymouth_added _cambonos_plymouth_hook
fi