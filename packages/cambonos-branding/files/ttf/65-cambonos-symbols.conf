<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer CambonOS Symbols for its private-use icon character. -->
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <int>1114109</int>
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>CambonOS Symbols</string>
    </edit>
  </match>
</fontconfig>
