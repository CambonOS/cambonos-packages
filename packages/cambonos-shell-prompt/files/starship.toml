"$schema" = "https://starship.rs/config-schema.json"

palette = "cambonos"

add_newline = true
command_timeout = 500
scan_timeout = 250

# First line: directory and Git context on the left; runtime, identity and
# package metadata on the right.
# Second line: input character on the left; command status on the right.
format = """
[╭─](fg:primary) ${custom.cambonos_directory}$git_branch$git_status$fill$python${custom.cambonos_pkgbuild}$package$username$hostname
[╰─](fg:primary) $character
"""

right_format = """
$status$jobs$cmd_duration
"""

[palettes.cambonos]
primary = "#AEFA50"
secondary = "#149246"
accent = "#70E7E6"
deep_blue = "#019FA7"
background = "#061C31"
text = "#F7F5EC"

[fill]
symbol = " "
style = "none"

# CambonOS renders the path itself so parent directories and the current
# directory can use different palette colors. Four directories are visible:
# three in deep_blue and the current directory in accent.
[directory]
disabled = true

[custom.cambonos_directory]
command = "/usr/bin/cambonos-starship-directory"
when = true
shell = ["/usr/bin/bash", "--noprofile", "--norc"]
format = "$output"
unsafe_no_escape = false

[git_branch]
symbol = "  "
format = "[$symbol$branch]($style) "
style = "bold fg:accent"
truncation_length = 32

[git_status]
format = '([$ahead_behind$all_status]($style) )'
style = "fg:text"
conflicted = "[=$count](bold fg:accent)"
ahead = "[⇡$count](fg:accent)"
behind = "[⇣$count](fg:accent)"
diverged = "[⇕⇡$ahead_count⇣$behind_count](fg:accent)"
up_to_date = ""
untracked = "[?$count](fg:secondary)"
stashed = "[*$count](fg:secondary)"
modified = "[!$count](fg:secondary)"
staged = "[+$count](fg:primary)"
renamed = "[»$count](fg:primary)"
deleted = "[✘$count](fg:secondary)"

[python]
symbol = " "
format = "[$symbol$virtualenv]($style) "
style = "fg:secondary"
detect_extensions = []
detect_files = []
detect_folders = []

# Arch PKGBUILD version. This intentionally reads literal pkgver/pkgrel
# assignments instead of sourcing PKGBUILD, which is executable shell code.
[custom.cambonos_pkgbuild]
command = '''pkgver=$(sed -n 's/^[[:space:]]*pkgver[[:space:]]*=[[:space:]]*//p' PKGBUILD | head -n1 | tr -d "\"' "); pkgrel=$(sed -n 's/^[[:space:]]*pkgrel[[:space:]]*=[[:space:]]*//p' PKGBUILD | head -n1 | tr -d "\"' "); [ -n "$pkgver" ] && printf '%s-%s' "$pkgver" "${pkgrel:-1}"'''
when = "test -f PKGBUILD"
shell = ["/usr/bin/bash", "--noprofile", "--norc"]
format = "[$symbol$output]($style) "
symbol = "󰏗 "
style = "fg:secondary"

# Starship's native package module extracts project versions from supported
# pyproject.toml metadata (PEP 621 / Poetry, among other supported backends).
[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
version_format = "v${raw}"
style = "fg:secondary"
display_private = true

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:accent)"
vimcmd_symbol = "[❮](bold fg:accent)"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold fg:accent"

[jobs]
symbol = "✦ "
format = "[$symbol$number]($style) "
style = "fg:accent"
number_threshold = 1

[cmd_duration]
min_time = 2000
format = "[󰥔 $duration]($style)"
style = "fg:deep_blue"

[username]
show_always = false
format = "[$user]($style)"
style_user = "fg:secondary"
style_root = "bold fg:secondary"

[hostname]
ssh_only = true
format = "[@](fg:deep_blue)[$hostname]($style) "
style = "bold fg:secondary"
trim_at = "."
