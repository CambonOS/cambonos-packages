"$schema" = "https://starship.rs/config-schema.json"

palette = "cambonos"

add_newline = true
command_timeout = 500
scan_timeout = 30

format = """
[╭─](fg:primary) $username$hostname$directory$python$git_branch$git_status$git_state
[╰─](fg:primary) $character
"""

right_format = "$status$jobs$cmd_duration"

[palettes.cambonos]
primary = "#AEFA50"
secondary = "#149246"
accent = "#70E7E6"
deep_blue = "#019FA7"
background = "#061C31"
text = "#FFFFFF"

[directory]
format = "[ ](fg:accent)[$path]($style)[$read_only]($read_only_style) "
style = "bold fg:text"
read_only = " "
read_only_style = "fg:accent"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold fg:accent"
truncation_length = 32

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "fg:text"
conflicted = "[=$count](bold fg:accent)"
ahead = "[⇡$count](fg:primary)"
behind = "[⇣$count](fg:accent)"
diverged = "[⇕⇡$ahead_count⇣$behind_count](fg:accent)"
up_to_date = ""
untracked = "[?$count](fg:deep_blue)"
stashed = "[*$count](fg:deep_blue)"
modified = "[!$count](fg:accent)"
staged = "[+$count](fg:primary)"
renamed = "[»$count](fg:accent)"
deleted = "[✘$count](fg:accent)"

[git_state]
format = '([$state $progress_current/$progress_total]($style) )'
style = "fg:accent"

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:accent)"
vimcmd_symbol = "[❮](bold fg:accent)"

[python]
symbol = " "
format = "[$symbol$virtualenv]($style) "
style = "fg:accent"
detect_extensions = []
detect_files = []
detect_folders = []

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold fg:accent"

[jobs]
symbol = "✦ "
format = "[$symbol$number]($style) "
style = "fg:accent"
number_threshold = 1

[cmd_duration]
min_time = 2000
format = "[󰥔 $duration]($style)"
style = "fg:deep_blue"

[username]
show_always = false
format = "[$user]($style)@"
style_user = "fg:text"
style_root = "bold fg:accent"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold fg:accent"
trim_at = "."
